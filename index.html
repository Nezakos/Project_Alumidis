<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaservice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Willkommen beim Pizzaservice</h1>
    <nav>
        <a href="info.html">Über uns &amp; Infos</a>
    </nav>
    <main>

        <h2>Pizza bestellen</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <button type="submit">Bestellen</button>
        </form>

        <!-- Bereich für die Anzeige/Ergebnisse -->
        <section class="ergebnisse">
            <h2>Aktuelle Bestellungen</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>Bestell-Nr.</th>
                        <th>Kundenname</th>
                        <th>Pizza</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Beispieldaten (werden später z. B. per JavaScript befüllt) -->
                    <tr>
                        <td>1</td>
                        <td>Max Mustermann</td>
                        <td>Margherita</td>
                        <td>In Zubereitung</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>Gruppe: Ahmad, Dimitrios , Ayham</p>
    </footer>

</body>
</html>
